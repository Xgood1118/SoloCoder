server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: ticket-system

  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:ticket_db;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

ticket:
  sla:
    urgent-response-hours: 2
    important-response-hours: 4
    normal-response-hours: 8
    low-response-hours: 24
    warning-threshold-minutes: 30

  assignment:
    auto-assign: true
    round-robin: true

  reminder:
    enable-dingtalk: false
    enable-email: false

  escalation:
    max-reminder-count: 3
    escalation-levels: 2

logging:
  level:
    com.ticket.system: debug
    org.springframework.security: info
