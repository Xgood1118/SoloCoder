server:
  port: 8125

spring:
  application:
    name: model-training-pipeline

  datasource:
    url: jdbc:h2:mem:trainingdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

logging:
  level:
    com.ai.training: DEBUG
    org.hibernate.SQL: DEBUG
