<div class="container">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
    <div style="display: flex; align-items: center; gap: 12px;">
      <button class="btn btn-default" (click)="goBack()">← 返回</button>
      <h2>{{ form?.name }} - 提交记录</h2>
    </div>
    <div style="display: flex; gap: 8px;">
      <button class="btn btn-default" (click)="addManual()">补录</button>
      <button class="btn btn-default" (click)="exportJson()">导出 JSON</button>
      <button class="btn btn-default" (click)="exportCsv()">导出 CSV</button>
      <button class="btn btn-default" (click)="exportExcel()">导出 Excel</button>
      <button class="btn btn-danger" (click)="batchDelete()" [disabled]="selectedIds.length === 0">
        批量删除 ({{ selectedIds.length }})
      </button>
    </div>
  </div>

  <div class="card" style="padding: 16px; margin-bottom: 16px;">
    <div style="display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-end;">
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <label class="form-label" style="font-size: 12px;">开始日期</label>
        <input type="date" class="form-input" [(ngModel)]="startDate" (change)="loadSubmissions()" style="width: 160px;">
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <label class="form-label" style="font-size: 12px;">结束日期</label>
        <input type="date" class="form-input" [(ngModel)]="endDate" (change)="loadSubmissions()" style="width: 160px;">
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <label class="form-label" style="font-size: 12px;">筛选字段</label>
        <select class="form-input" [(ngModel)]="filterField" style="width: 150px;">
          <option value="">全部</option>
          <option *ngFor="let f of form?.fields" [value]="f.key">{{ f.label }}</option>
        </select>
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <label class="form-label" style="font-size: 12px;">操作符</label>
        <select class="form-input" [(ngModel)]="filterOperator" style="width: 120px;">
          <option value="eq">等于</option>
          <option value="ne">不等于</option>
          <option value="gt">大于</option>
          <option value="lt">小于</option>
          <option value="gte">大于等于</option>
          <option value="lte">小于等于</option>
          <option value="contains">包含</option>
        </select>
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <label class="form-label" style="font-size: 12px;">值</label>
        <input type="text" class="form-input" [(ngModel)]="filterValue" style="width: 150px;">
      </div>
      <button class="btn btn-primary" (click)="loadSubmissions()">筛选</button>
    </div>
  </div>

  <div class="card">
    <div *ngIf="submissions.length === 0" style="text-align: center; color: #999; padding: 40px 0;">
      暂无提交记录
    </div>

    <div *ngIf="submissions.length > 0" style="overflow-x: auto;">
      <table>
        <thead>
          <tr>
            <th style="width: 40px;">
              <input type="checkbox" (change)="toggleSelectAll($event)" [checked]="selectedIds.length === submissions.length">
            </th>
            <th>ID</th>
            <th *ngFor="let field of form?.fields">{{ field.label }}</th>
            <th>补录</th>
            <th>提交时间</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let sub of submissions">
            <td>
              <input type="checkbox" (change)="toggleSelect(sub.id, $event)" [checked]="selectedIds.includes(sub.id)">
            </td>
            <td>{{ sub.id }}</td>
            <td *ngFor="let field of form?.fields">{{ getFieldValue(sub.data, field.key) }}</td>
            <td>
              <span *ngIf="sub.is补录" class="tag tag-warning">补录</span>
              <span *ngIf="!sub.is补录" class="tag tag-success">正常</span>
            </td>
            <td>{{ sub.createdAt | date:'yyyy-MM-dd HH:mm:ss' }}</td>
            <td>
              <button class="btn btn-sm btn-default" (click)="replayWebhook(sub.id)">重放 Webhook</button>
              <button class="btn btn-sm btn-danger" (click)="deleteSubmission(sub.id)">删除</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<div class="modal-backdrop" *ngIf="showManualModal" (click)="showManualModal = false">
  <div class="modal" style="max-width: 600px;" (click)="$event.stopPropagation()">
    <h3>补录提交记录</h3>
    <div *ngFor="let field of form?.fields" class="form-item">
      <label class="form-label">
        {{ field.label }}
        <span *ngIf="field.required" class="required">*</span>
      </label>
      <input *ngIf="field.type === 'text' || field.type === 'textarea' || field.type === 'number' || field.type === 'date' || field.type === 'time'"
             [type]="field.type === 'number' ? 'number' : (field.type === 'date' || field.type === 'time' ? field.type : 'text')"
             class="form-input"
             [(ngModel)]="manualData[field.key]">
      <select *ngIf="field.type === 'select'" class="form-input" [(ngModel)]="manualData[field.key]">
        <option value="">请选择</option>
        <option *ngFor="let opt of field.options" [value]="opt.value">{{ opt.label }}</option>
      </select>
      <div *ngIf="field.type === 'radio'" class="radio-group">
        <label *ngFor="let opt of field.options" class="radio-item">
          <input type="radio" [(ngModel)]="manualData[field.key]" [value]="opt.value">
          {{ opt.label }}
        </label>
      </div>
      <div *ngIf="field.type === 'rating'" class="rating">
        <span *ngFor="let star of [1,2,3,4,5]"
              class="rating-star"
              [class.active]="manualData[field.key] >= star"
              (click)="manualData[field.key] = star">★</span>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-default" (click)="showManualModal = false">取消</button>
      <button class="btn btn-primary" (click)="submitManual()">提交</button>
    </div>
  </div>
</div>
