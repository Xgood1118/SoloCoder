server:
  port: 8080

spring:
  application:
    name: feature-flag-service

  datasource:
    url: jdbc:h2:mem:featureflag;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=10000, expireAfterWrite=300s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

featureflag:
  cache:
    default-expire-seconds: 300
    maximum-size: 10000
  long-polling:
    timeout-seconds: 30
  schedule:
    cron-enabled: true
