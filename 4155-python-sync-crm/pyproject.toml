[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crm-sync-service"
version = "1.0.0"
description = "CRM与营销平台数据同步服务"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "sqlalchemy>=2.0.23",
    "pydantic-settings>=2.1.0",
    "pydantic>=2.5.0",
    "celery>=5.3.4",
    "redis>=5.0.1",
    "apscheduler>=3.10.4",
    "httpx>=0.25.2",
    "requests>=2.31.0",
    "pandas>=2.1.4",
    "python-dateutil>=2.8.2",
    "pytz>=2023.3",
    "loguru>=0.7.2",
    "tenacity>=8.2.3",
    "alembic>=1.12.1",
    "pymysql>=1.1.0",
    "cryptography>=41.0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "testcontainers>=3.7.1",
    "black>=23.11.0",
    "flake8>=6.1.0",
    "mypy>=1.7.1",
]

[tool.setuptools.packages.find]
where = ["src"]
