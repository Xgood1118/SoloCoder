version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: crm_sync_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: crm_sync
      MYSQL_USER: crm_sync
      MYSQL_PASSWORD: crm_sync_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: crm_sync_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: crm_sync_api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=mysql+pymysql://crm_sync:crm_sync_password@mysql:3306/crm_sync
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - PYTHONPATH=/app/src
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config
    command: uvicorn crm_sync.api.main:app --host 0.0.0.0 --port 8000 --reload

  celery_worker:
    build: .
    container_name: crm_sync_celery_worker
    environment:
      - DATABASE_URL=mysql+pymysql://crm_sync:crm_sync_password@mysql:3306/crm_sync
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - PYTHONPATH=/app/src
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config
    command: celery -A crm_sync.tasks.celery_app worker --loglevel=info --concurrency=4

  celery_beat:
    build: .
    container_name: crm_sync_celery_beat
    environment:
      - DATABASE_URL=mysql+pymysql://crm_sync:crm_sync_password@mysql:3306/crm_sync
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - PYTHONPATH=/app/src
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config
    command: celery -A crm_sync.tasks.celery_app beat --loglevel=info

volumes:
  mysql_data:
  redis_data:
