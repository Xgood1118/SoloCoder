server:
  port: 8100

spring:
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

cache:
  proxy:
    enabled: true
    l1:
      default-ttl: 300
      maximum-size: 10000
      time-unit: SECONDS
    l2:
      default-ttl: 3600
      time-unit: SECONDS
      key-prefix: "cache:proxy:"
    pubsub:
      channel: cache:proxy:evict
      instance-id: instance-1
    penetration:
      enabled: true
      miss-threshold: 3
      bloom-expected-insertions: 100000
      bloom-fpp: 0.01
      bloom-ttl: 3600
      time-unit: SECONDS

logging:
  level:
    com.cacheproxy: DEBUG
    org.springframework.data.redis: INFO
