[project]
name = "data_io"
version = "0.1.0"
description = "Python data import/export toolkit"
requires-python = ">=3.9"
dependencies = [
    "openpyxl>=3.1.0",
    "chardet>=5.0.0",
    "python-dateutil>=2.8.0",
]

[project.optional-dependencies]
xls = ["xlrd>=2.0.0", "xlwt>=1.3.0"]
mysql = ["pymysql>=1.1.0"]
postgres = ["psycopg2-binary>=2.9.0"]
api = ["requests>=2.31.0"]
all = [
    "xlrd>=2.0.0",
    "xlwt>=1.3.0",
    "pymysql>=1.1.0",
    "psycopg2-binary>=2.9.0",
    "requests>=2.31.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.pytest.ini_options]
testpaths = ["tests"]
