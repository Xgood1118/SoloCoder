[package]
name = "metrics_collector"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
warp = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12"
hdrhistogram = "7.5"
log = "0.4"
env_logger = "0.10"
chrono = { version = "0.4", features = ["serde"] }
dashmap = "5.5"

[dev-dependencies]
reqwest = { version = "0.11", features = ["json", "blocking"] }
tokio-test = "0.4"
