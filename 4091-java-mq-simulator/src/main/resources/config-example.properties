# ============================================
# MQ Simulator 配置示例
# ============================================

# ---------- Kafka 配置 ----------
kafka.bootstrap.servers=localhost:9092
kafka.group.id=mq-simulator-group
kafka.auto.commit=true
kafka.auto.commit.interval.ms=1000
kafka.session.timeout.ms=30000
kafka.acks=all
kafka.retries=3

# ---------- RabbitMQ 配置 ----------
rabbitmq.host=localhost
rabbitmq.port=5672
rabbitmq.username=guest
rabbitmq.password=guest
rabbitmq.virtual.host=/
rabbitmq.connection.timeout.ms=30000
rabbitmq.auto.recovery=true

# ---------- 通用配置 ----------
simulator.schemas.dir=schemas
simulator.recordings.dir=recordings
simulator.dlq.dir=dlq
simulator.max.retry.count=3
simulator.retry.interval.ms=5000

# ---------- 生产者配置 ----------
producer.default.delivery.timeout.ms=120000
producer.default.request.timeout.ms=30000
producer.batch.size=16384
producer.linger.ms=0
producer.compression.type=none

# ---------- 消费者配置 ----------
consumer.poll.timeout.ms=1000
consumer.max.poll.records=500
consumer.auto.offset.reset=latest
