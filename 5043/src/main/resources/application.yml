server:
  port: 8300
  servlet:
    context-path: /oauth2

spring:
  application:
    name: oauth2-auth-server

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/oauth2_auth?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: root123
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5

  session:
    store-type: redis
    redis:
      namespace: spring:session
    timeout: 1800

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

  security:
    oauth2:
      client:
        registration:
          wechat:
            client-id: ${WECHAT_CLIENT_ID:wx_app_id}
            client-secret: ${WECHAT_CLIENT_SECRET:wx_app_secret}
            client-name: 微信登录
            provider: wechat
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: snsapi_login
          dingtalk:
            client-id: ${DINGTALK_CLIENT_ID:dingtalk_app_id}
            client-secret: ${DINGTALK_CLIENT_SECRET:dingtalk_app_secret}
            client-name: 钉钉登录
            provider: dingtalk
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid,corpid
          wework:
            client-id: ${WEWORK_CLIENT_ID:wework_app_id}
            client-secret: ${WEWORK_CLIENT_SECRET:wework_app_secret}
            client-name: 企业微信登录
            provider: wework
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: snsapi_base
        provider:
          wechat:
            authorization-uri: https://open.weixin.qq.com/connect/qrconnect
            token-uri: https://api.weixin.qq.com/sns/oauth2/access_token
            user-info-uri: https://api.weixin.qq.com/sns/userinfo
            user-name-attribute: openid
          dingtalk:
            authorization-uri: https://login.dingtalk.com/oauth2/auth
            token-uri: https://api.dingtalk.com/v1.0/oauth2/userAccessToken
            user-info-uri: https://api.dingtalk.com/v1.0/contact/users/me
            user-name-attribute: openid
          wework:
            authorization-uri: https://open.weixin.qq.com/connect/oauth2/authorize
            token-uri: https://qyapi.weixin.qq.com/cgi-bin/gettoken
            user-info-uri: https://qyapi.weixin.qq.com/cgi-bin/user/getuserinfo
            user-name-attribute: UserId

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.oauth2.server.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

oauth2:
  token:
    access-token-expire-seconds: 7200
    refresh-token-expire-seconds: 2592000
    issuer: http://localhost:8080/oauth2
    signing-key: oauth2-auth-server-signing-key-2024-secret

  rate-limit:
    enabled: true
    default-quota: 1000
    time-window-seconds: 60

logging:
  level:
    root: info
    com.oauth2.server: debug
    org.springframework.security: debug
